version: '3.8'

services:
  calculator:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: llm-training-calculator:latest
    container_name: llm-calculator
    volumes:
      # Mount results directory for output files (optional)
      - ./results:/app/results
      # Uncomment to override configuration files:
      # - ./my_project_config.py:/app/configuration/project_config.py:ro
      # - ./my_hardware_config.py:/app/configuration/hardware_config.py:ro
      # - ./my_variants_config.py:/app/configuration/variants_config.py:ro
      # - ./my_advanced_config.py:/app/configuration/advanced_config.py:ro
    environment:
      - USE_COLOR=True
      - PYTHONUNBUFFERED=1
    # ENTRYPOINT is python3 model_calculations.py
    # Pass flags via 'command' — e.g. uncomment for concise report:
    # command: ["--report"]
